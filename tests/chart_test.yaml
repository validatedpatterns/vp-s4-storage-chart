suite: vp-s4-storage chart
release:
  name: test-release
  namespace: s4-test
values:
  - ../values.yaml
set:
  s4UICredentials.vaultKey: secret/data/hub/s4-ui-credentials
  s4APICredentials.vaultKey: secret/data/hub/s4-api-credentials
  s4Role.buckets:
    - demo-bucket
  vp-rbac.serviceAccounts.vp-s4-storage-sa.namespace: s4-test
  vp-rbac.roles.external-secrets-validator.namespace: s4-test

tests:
  - it: creates one ExternalSecret with UI and API vault extracts
    template: templates/external-secret-s4-credentials.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: s4-credentials
      - equal:
          path: spec.target.name
          value: s4-credentials
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/s4-ui-credentials
      - equal:
          path: spec.dataFrom[1].extract.key
          value: secret/data/hub/s4-api-credentials

  - it: creates ExternalSecret with API extract only when UI vault path is unset
    set:
      s4UICredentials.vaultKey: ""
    template: templates/external-secret-s4-credentials.yaml
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/s4-api-credentials
      - lengthEqual:
          path: spec.dataFrom
          count: 1

  - it: creates validation job when credentials are configured
    template: templates/external-secrets-validation-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vp-s4-storage-sa
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: EXTERNAL_SECRET="s4-credentials"

  - it: creates bucket ConfigMap with valid data keys
    template: templates/s4-buckets-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["s4-buckets.yml"]
      - exists:
          path: data["vars.defaults.yml"]
      - notExists:
          path: data["vars/defaults.yml"]

  - it: mounts playbook files with directory layout via volume items
    template: templates/s4-buckets-bootstrap-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].path
          value: s4-buckets.yml
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[1].path
          value: vars/defaults.yml

  - it: passes full s4_s4 endpoint vars in runtime extra-vars
    template: templates/s4-buckets-bootstrap-job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: endpointProtocol
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: endpointAddress
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: endpointPort

  - it: creates bucket provisioning Job and CronJob with bucket list
    templates:
      - templates/s4-buckets-bootstrap-job.yaml
      - templates/s4-buckets-cronjob.yaml
      - templates/s4-buckets-configmap.yaml
    asserts:
      - template: templates/s4-buckets-bootstrap-job.yaml
        isKind:
          of: Job
      - template: templates/s4-buckets-cronjob.yaml
        isKind:
          of: CronJob
      - template: templates/s4-buckets-bootstrap-job.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: s4-credentials

  - it: points s4 subchart at the credentials secret
    chart:
      version: 0.1.0
    templates:
      - charts/s4/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: s4-credentials

  - it: skips bucket jobs when no buckets are configured
    set:
      s4Role.buckets: []
    templates:
      - templates/s4-buckets-bootstrap-job.yaml
      - templates/s4-buckets-cronjob.yaml
      - templates/s4-buckets-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: skips validation job when no credential vault paths are set
    set:
      s4UICredentials.vaultKey: ""
      s4APICredentials.vaultKey: ""
    template: templates/external-secrets-validation-job.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: skips ExternalSecret when no credential vault paths are set
    set:
      s4UICredentials.vaultKey: ""
      s4APICredentials.vaultKey: ""
    template: templates/external-secret-s4-credentials.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates ConsoleLink for Web UI when route host is set
    set:
      s4.route.host: s4.apps.example.com
    template: templates/consolelink.yaml
    asserts:
      - isKind:
          of: ConsoleLink
      - equal:
          path: spec.href
          value: https://s4.apps.example.com

  - it: builds ConsoleLink href from global.localClusterDomain when route host is empty
    set:
      s4.route.host: ""
      global.localClusterDomain: apps.test.example.com
    template: templates/consolelink.yaml
    asserts:
      - equal:
          path: spec.href
          value: https://test-release-s4-s4-test.apps.test.example.com

  - it: skips ConsoleLink when Web UI route is disabled
    set:
      s4.route.enabled: false
      global.localClusterDomain: apps.test.example.com
    template: templates/consolelink.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: skips ConsoleLink when href cannot be determined
    set:
      s4.route.host: ""
      global.localClusterDomain: ""
      consoleLink.ingressDomain: ""
      consoleLink.href: ""
    template: templates/consolelink.yaml
    asserts:
      - hasDocuments:
          count: 0
