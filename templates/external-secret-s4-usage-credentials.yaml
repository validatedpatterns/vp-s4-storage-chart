{{- if .Values.s4UsageCredentials.vaultKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.s4UsageCredentials.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.s4UsageCredentials.secretName }}
  dataFrom:
    - extract:
        key: {{ .Values.s4UsageCredentials.vaultKey }}
{{- end }}
