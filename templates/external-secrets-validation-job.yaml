{{- $ui := .Values.s4UICredentials -}}
{{- $api := .Values.s4APICredentials -}}
{{- if and (not $.Values.validationJob.disabled) (or $ui.vaultKey $api.vaultKey) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vp-s4-storage.fullname" . }}-external-secrets-validation
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 3
  activeDeadlineSeconds: {{ $.Values.validationJob.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $.Values.serviceAccountName }}
      containers:
        - name: secrets-validator
          image: {{ .Values.configJob.image }}
          imagePullPolicy: {{ $.Values.configJob.imagePullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
                set -euo pipefail
                EXTERNAL_SECRET="{{ .Values.s4Credentials.secretName }}"
                MERGED_SECRET="{{ .Values.s4Credentials.secretName }}"
                TIMEOUT={{ .Values.validationJob.activeDeadlineSeconds }}
                WAIT_INTERVAL=10
                START_TIME=$(date +%s)

                check_external_secret_status() {
                  local name=$1
                  if ! kubectl get externalsecret "$name" >/dev/null 2>&1; then
                    echo "ERROR: ExternalSecret $name does not exist"
                    return 1
                  fi
                  local ready
                  ready=$(kubectl get externalsecret "$name" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
                  if [ "$ready" != "True" ]; then
                    echo "ERROR: ExternalSecret $name is not ready (status=$ready)"
                    return 1
                  fi
                  return 0
                }

                check_secret() {
                  local name=$1
                  if ! kubectl get secret "$name" >/dev/null 2>&1; then
                    echo "ERROR: Secret $name does not exist"
                    return 1
                  fi
                  local count
                  count=$(kubectl get secret "$name" -o jsonpath='{.data}' | jq -r 'length')
                  if [ "$count" -eq 0 ]; then
                    echo "ERROR: Secret $name has no data"
                    return 1
                  fi
                  return 0
                }

                echo "Waiting for ExternalSecret ${EXTERNAL_SECRET} → Secret ${MERGED_SECRET}"
                while true; do
                  ELAPSED=$(( $(date +%s) - START_TIME ))
                  if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                    echo "ERROR: timed out after ${TIMEOUT}s"
                    exit 1
                  fi
                  if check_external_secret_status "${EXTERNAL_SECRET}" && check_secret "${MERGED_SECRET}"; then
                    echo "ExternalSecret and Secret are ready"
                    exit 0
                  fi
                  sleep "$WAIT_INTERVAL"
                done
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
{{- end }}
